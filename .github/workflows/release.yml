name: Build & Attach Release

on:
  push:
    tags:
      - 'v*.*.*'  # Support all semantic versions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'app/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run quality checks
        run: |
          cd app
          npm run lint
          npm run typecheck
          npm run format:check

      - name: Build Chrome extension
        run: ./scripts/build-extension.sh chrome

      - name: Package Chrome extension
        run: ./scripts/package-extension.sh chrome ${{ steps.version.outputs.VERSION }}

      - name: Build Firefox extension
        run: ./scripts/build-extension.sh firefox

      - name: Package Firefox extension
        run: ./scripts/package-extension.sh firefox ${{ steps.version.outputs.VERSION }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packing/chrome-${{ steps.version.outputs.VERSION }}.zip
            packing/firefox-${{ steps.version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
